<!--
  Шаблон письма «Confirm signup» для Supabase-проекта bqtpoxksmlxnatxrrhva.

  Этот проект обслуживает сразу два приложения — AdilRent (сайт, подтверждение
  по ссылке) и AdilTranslator (iOS, вход по коду из письма). Шаблоны писем в
  Supabase общие на весь проект, поэтому письмо обязано работать в обоих
  случаях: сверху кнопка со ссылкой, ниже — тот же код цифрами.

  Это письмо стоит в проекте, пока AdilTranslator ждёт проверки в App Store:
  ревьюер входит в приложение кодом из письма, и убрать код сейчас — значит
  получить отказ по 2.1 за приложение, в которое невозможно войти.

  Когда переводчик уедет на свой проект, сюда встанет `confirm-signup.html`
  из этой же папки — то же письмо, но без кода.

  Куда вставлять: Dashboard → Authentication → Emails → Confirm signup.
  Переменные: {{ .ConfirmationURL }} — ссылка, {{ .Token }} — цифровой код.
-->
<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#F8F6F2;padding:32px 12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
  <tr>
    <td align="center">
      <table width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;background:#FFFFFF;border:1px solid #E8E2D8;border-radius:20px;">
        <tr>
          <td style="padding:36px 32px 32px 32px;text-align:center;">

            <div style="font-size:20px;font-weight:700;color:#14171C;letter-spacing:-.2px;">
              Adil<span style="color:#8A6116;">.</span>
            </div>

            <div style="height:28px;line-height:28px;">&nbsp;</div>

            <div style="font-size:21px;font-weight:700;color:#14171C;line-height:1.3;">
              Подтвердите вашу почту
            </div>

            <div style="height:10px;line-height:10px;">&nbsp;</div>

            <div style="font-size:14px;color:#6B675F;line-height:1.6;">
              Осталось одно нажатие — и аккаунт готов.
            </div>

            <div style="height:26px;line-height:26px;">&nbsp;</div>

            <table cellpadding="0" cellspacing="0" border="0" width="100%">
              <tr>
                <td align="center" style="background:#8A6116;border-radius:12px;">
                  <a href="{{ .ConfirmationURL }}"
                     style="display:block;padding:15px 24px;font-size:15px;font-weight:700;color:#FFFFFF;text-decoration:none;">
                    Подтвердить почту
                  </a>
                </td>
              </tr>
            </table>

            <div style="height:28px;line-height:28px;">&nbsp;</div>

            <table cellpadding="0" cellspacing="0" border="0" width="100%">
              <tr>
                <td style="border-top:1px solid #E8E2D8;font-size:0;line-height:0;">&nbsp;</td>
              </tr>
            </table>

            <div style="height:24px;line-height:24px;">&nbsp;</div>

            <div style="font-size:13px;color:#6B675F;line-height:1.6;">
              Если приложение просит код — введите его вручную:
            </div>

            <div style="height:12px;line-height:12px;">&nbsp;</div>

            <table cellpadding="0" cellspacing="0" border="0" width="100%">
              <tr>
                <td align="center" style="background:#F3EFE8;border:1px solid #E8E2D8;border-radius:12px;padding:16px 12px;">
                  <span style="font-family:'SF Mono',Menlo,Consolas,monospace;font-size:28px;font-weight:700;color:#14171C;letter-spacing:6px;">{{ .Token }}</span>
                </td>
              </tr>
            </table>

            <div style="height:26px;line-height:26px;">&nbsp;</div>

            <div style="font-size:12px;color:#6B675F;line-height:1.6;">
              Если вы не создавали аккаунт — просто удалите это письмо.
            </div>

          </td>
        </tr>
      </table>

      <div style="height:18px;line-height:18px;">&nbsp;</div>

      <div style="font-size:12px;color:#6B675F;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;">
        Adil — аренда жилья и машин в Медине
      </div>

    </td>
  </tr>
</table>
