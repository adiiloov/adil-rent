<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Подтверждение email — Adil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --brand:#8A6116;--on-brand:#0A1424;
  --ok:#1B7A52;--ok-bg:#EAF5EF;
  --red:#B3352A;--red-light:#FDEEEC;--red-bd:#F5D3CD;
  --text:#14171C;--muted:#6B675F;
  --border:#E8E2D8;--bg:#F8F6F2;--white:#FFFFFF;--surface-2:#F3EFE8;
  --info:#1D4ED8;--warn:#8E620A;
}
@media (prefers-color-scheme:dark){
  :root{
    --brand:#D4A257;--on-brand:#0A1424;
    --ok:#34D399;--ok-bg:#10281F;
    --red:#F87171;--red-light:#2A1618;--red-bd:#4A2226;
    --text:#EDF2F9;--muted:#92A1B9;
    --border:#1F304D;--bg:#0A1424;--white:#101D33;--surface-2:#16243C;
    --info:#60A5FA;--warn:#FBBF24;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.card{background:var(--white);border:1px solid var(--border);border-radius:20px;padding:40px 32px;max-width:420px;width:100%;text-align:center;box-shadow:0 8px 40px rgba(20,23,28,.08)}
.logo{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:32px}
.logo span{font-family:'Sora',sans-serif;font-size:20px;font-weight:700;color:var(--text)}
.logo em{color:var(--brand);font-style:normal}

/* Success state */
.success-circle{width:88px;height:88px;border-radius:50%;background:var(--ok-bg);border:1px solid var(--ok);display:flex;align-items:center;justify-content:center;margin:0 auto 22px;animation:popIn .5s cubic-bezier(.175,.885,.32,1.275)}
@keyframes popIn{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
.checkmark{width:38px;height:38px}
.checkmark path{stroke:var(--ok);stroke-width:3;fill:none;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .4s ease .3s forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* Loading state */
.loading-circle{width:88px;height:88px;border-radius:50%;border:4px solid var(--surface-2);border-top:4px solid var(--brand);margin:0 auto 22px;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Error state */
.error-circle{width:88px;height:88px;border-radius:50%;background:var(--red-light);border:1px solid var(--red-bd);display:flex;align-items:center;justify-content:center;margin:0 auto 22px;animation:popIn .5s cubic-bezier(.175,.885,.32,1.275)}
.error-x{font-size:36px;color:var(--red);line-height:1}

.title{font-family:'Sora',sans-serif;font-size:21px;font-weight:700;color:var(--text);margin-bottom:9px}
.subtitle{font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:26px}
.email-badge{background:var(--ok-bg);border:1px solid var(--ok);border-radius:10px;padding:10px 16px;font-size:13px;color:var(--ok);font-weight:600;margin-bottom:22px;display:none}
.btn{display:block;width:100%;background:var(--brand);color:var(--on-brand);text-decoration:none;border-radius:12px;padding:15px;font-size:15px;font-weight:700;cursor:pointer;border:none;font-family:'Sora',sans-serif;transition:opacity .15s}
.btn:hover{opacity:.88}
.btn-ghost{display:block;width:100%;background:var(--surface-2);color:var(--text);text-decoration:none;border-radius:12px;padding:13px;font-size:14px;font-weight:600;margin-top:9px;border:1px solid var(--border);cursor:pointer;font-family:inherit}
.btn-ghost:hover{background:var(--border)}
.footer-txt{margin-top:22px;font-size:12px;color:var(--muted)}
.confetti{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:hidden;z-index:0}
.piece{position:absolute;width:8px;height:8px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>

<div class="confetti" id="confetti"></div>

<div class="card" style="position:relative;z-index:1">
  <div class="logo">
    <svg width="30" height="30" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Adil">
      <defs><linearGradient id="agl" gradientUnits="userSpaceOnUse" x1="8" y1="6" x2="24" y2="26">
        <stop offset="0" stop-color="#E8CFA0"/><stop offset="1" stop-color="#C08A2E"/>
      </linearGradient></defs>
      <rect width="32" height="32" rx="8" fill="#0C1728"/>
      <path d="M10.5 25V13.2a5.5 5.5 0 0 1 11 0V25" stroke="url(#agl)" stroke-width="2.6" fill="none" stroke-linecap="square"/>
      <path d="M7.6 19.4h16.8" stroke="url(#agl)" stroke-width="2.6" stroke-linecap="square"/>
    </svg>
    <span><em>Adil</em></span>
  </div>

  <!-- LOADING -->
  <div id="state-loading">
    <div class="loading-circle"></div>
    <div class="title">Подтверждаем...</div>
    <div class="subtitle">Пожалуйста, подождите пару секунд</div>
  </div>

  <!-- SUCCESS -->
  <div id="state-success" style="display:none">
    <div class="success-circle">
      <svg class="checkmark" viewBox="0 0 52 52">
        <path d="M14 27 L22 35 L38 19" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="title">Email подтверждён! 🎉</div>
    <div class="subtitle">Аккаунт активирован — теперь можно размещать объявления на Adil.</div>
    <div class="email-badge" id="email-badge">✓ <span id="confirmed-email"></span></div>
    <a href="/" class="btn">Перейти на сайт</a>
    <div class="footer-txt">Добро пожаловать в Adil 🏠🚗</div>
  </div>

  <!-- ERROR -->
  <div id="state-error" style="display:none">
    <div class="error-circle"><div class="error-x">✕</div></div>
    <div class="title">Ссылка недействительна</div>
    <div class="subtitle" id="error-msg">Ссылка для подтверждения устарела или уже использована.</div>
    <a href="/" class="btn">На главную</a>
  </div>
</div>

<script>
var SUPABASE_URL = 'https://bqtpoxksmlxnatxrrhva.supabase.co';
var SUPABASE_ANON_KEY = 'sb_publishable_rfMc_DEldXr8hN-hrb63cg_fOFFTW8G';
var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function showState(s){
  ['loading','success','error'].forEach(function(x){
    document.getElementById('state-'+x).style.display = x===s?'block':'none';
  });
}

function launchConfetti(){
  // Цвета — из палитры сайта, а не случайный праздничный набор.
  var colors=['#8A6116','#1B7A52','#1D4ED8','#8E620A','#B3352A'];
  var container=document.getElementById('confetti');
  for(var i=0;i<70;i++){
    var el=document.createElement('div');
    el.className='piece';
    el.style.left=Math.random()*100+'%';
    el.style.background=colors[Math.floor(Math.random()*colors.length)];
    el.style.width=(Math.random()*8+4)+'px';
    el.style.height=(Math.random()*8+4)+'px';
    el.style.animationDuration=(Math.random()*2+1.5)+'s';
    el.style.animationDelay=(Math.random()*1)+'s';
    container.appendChild(el);
  }
  setTimeout(function(){ container.innerHTML=''; }, 4000);
}

async function handleConfirmation(){
  // Токен приходит либо в хэше (#access_token=...), либо в query (?token_hash=...)
  var hash = window.location.hash.substring(1);
  var params = new URLSearchParams(hash || window.location.search);

  var accessToken = params.get('access_token');
  var refreshToken = params.get('refresh_token');
  var type = params.get('type');
  var tokenHash = params.get('token_hash');
  var token = params.get('token');

  try {
    var result;

    if(accessToken && type === 'signup'){
      result = await sb.auth.setSession({
        access_token: accessToken,
        refresh_token: refreshToken || ''
      });
    } else if(tokenHash){
      result = await sb.auth.verifyOtp({
        token_hash: tokenHash,
        type: type || 'signup'
      });
    } else if(token && type){
      result = await sb.auth.verifyOtp({
        token_hash: token,
        type: type
      });
    } else {
      var sessionResult = await sb.auth.getSession();
      if(sessionResult.data && sessionResult.data.session){
        result = sessionResult;
      } else {
        throw new Error('Нет токена для подтверждения');
      }
    }

    if(result.error) throw result.error;

    var user = result.data.user || result.data.session?.user;
    showState('success');
    launchConfetti();

    if(user && user.email){
      var badge = document.getElementById('email-badge');
      var emailEl = document.getElementById('confirmed-email');
      if(badge && emailEl){
        emailEl.textContent = user.email;
        badge.style.display = 'block';
      }
    }

    setTimeout(function(){ window.location.href = '/'; }, 4000);

  } catch(err){
    console.error('Confirmation error:', err);
    showState('error');
    var msgEl = document.getElementById('error-msg');
    if(msgEl && err.message){
      if(err.message.includes('expired') || err.message.includes('устарел')){
        msgEl.textContent = 'Ссылка для подтверждения устарела. Зарегистрируйтесь ещё раз — прежние данные сохранятся.';
      } else if(err.message.includes('already')){
        msgEl.textContent = 'Email уже подтверждён. Просто войдите в аккаунт.';
      }
    }
  }
}

handleConfirmation();
</script>
</body>
</html>
